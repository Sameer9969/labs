<!DOCTYPE html>
<html>

<head>

    <!-- Browser Title -->
    <title>Contact Page</title>

</head>

<body>

    <center>

        <!-- Heading -->
        <h1>Contact Us</h1>

        <!-- Navigation -->
        <a href="home.html">Home</a> 
        <a href="about.html">About</a> 
        <a href="services.html">Services</a> 
        <a href="contact.html">Contact</a>

        <hr>

        <!-- Contact Form -->
        <form>

            <!-- Name -->
            <label>Name :</label>

            <input
                type="text"
                placeholder="Enter Your Name"
            >

            <br><br>

            <!-- Email -->
            <label>Email :</label>

            <input
                type="email"
                placeholder="Enter Email"
            >

            <br><br>

            <!-- Message -->
            <label>Message :</label>

            <br>

            <textarea
                rows="5"
                cols="30"
                placeholder="Enter Message"
            ></textarea>

            <br><br>

            <!-- Button -->
            <input
                type="submit"
                value="Send Message"
            >

        </form>

        <hr>

        <!-- Contact Details -->
        <h3>Contact Information</h3>

        <p>

            Email : info@example.com

            <br>

            Phone : +91 9876543210

        </p>

        <hr>

        <a href="home.html">

            <button>Back to Home</button>

        </a>

    </center>

</body>

</html>
